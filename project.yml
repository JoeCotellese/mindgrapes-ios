# ABOUTME: XcodeGen spec for the MindGrapes app target.
# ABOUTME: The .xcodeproj is generated and gitignored; this file is the source of truth.

name: MindGrapes

options:
  bundleIdPrefix: net.cotellese
  deploymentTarget:
    # iOS 27 for the `.notes.createNote` app schema (SPEC 10.7): the macro's
    # generated conformance is @available(iOS 27.0, *), and gating it would mean
    # either a duplicate 26-compatible intent or no App Shortcuts on 26.
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # No development team is checked in. Simulator builds do not need one;
    # add DEVELOPMENT_TEAM locally (or via xcconfig) for device builds.
    CODE_SIGN_STYLE: Automatic

packages:
  MindGrapesKit:
    path: MindGrapesKit

targets:
  MindGrapes:
    type: application
    platform: iOS
    sources:
      - path: MindGrapes
    dependencies:
      - package: MindGrapesKit
        product: MindGrapesKit
      # Embeds the watch app into this bundle's Watch/ directory. The dependency
      # is what makes the two apps counterparts, and WCSession only connects
      # counterparts — an independent watch app could not reach the phone at all
      # (SPEC 4.2, Decision 5).
      - target: MindGrapesWatch
    # Signing.xcconfig supplies DEVELOPMENT_TEAM from an untracked local file for
    # device and release builds. It is empty by default, so a clone with nothing
    # set up still generates and builds for the simulator.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.cotellese.mindgrapes
        # Liquid Glass app icon (Icon Composer .icon bundle, iOS 26). Name must
        # match MindGrapes.icon in the target sources.
        ASSETCATALOG_COMPILER_APPICON_NAME: MindGrapes
        CODE_SIGN_ENTITLEMENTS: MindGrapes/MindGrapes.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Interface orientations. iPad must declare all four (or UIRequiresFullScreen
        # with a subset) or App Store Connect rejects the bundle at upload (#18).
        # Lives here, not in the Xcode project: the .xcodeproj is regenerated from
        # this file at archive time, so an edit made in Xcode would be wiped.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
    info:
      path: MindGrapes/Info.plist
      properties:
        CFBundleDisplayName: MindGrapes
        # How Siri hears and says the app name. "MindGrapes" as one written word
        # is not what anyone says out loud, and an App Shortcut only matches when
        # the utterance carries the app name — so the spoken form and the aliases
        # are what make "capture a thought in mind grapes" reach our intent
        # instead of Apple Notes.
        CFBundleSpokenName: Mind Grapes
        INAlternativeAppNames:
          - INAlternativeAppName: Mind Grapes
          - INAlternativeAppName: Grapes
        UILaunchScreen: {}
        # Slice 2 camera capture. The photo picker uses the out-of-process
        # PHPicker and needs no photo-library string.
        NSCameraUsageDescription: MindGrapes uses the camera to scan your server's QR code and to capture photo memories.
        # Slice 3 location capture (SPEC 9). When-In-Use only; captures attach
        # where they happened when the location toggle is on.
        NSLocationWhenInUseUsageDescription: MindGrapes tags a capture with where you made it, when you turn location on.
        # The OAuth callback scheme (SPEC 5.2). Registered here rather than
        # with the auth feature because it is app identity, not behavior:
        # the server's DCR registration must match this string exactly.
        CFBundleURLTypes:
          - CFBundleURLName: net.cotellese.mindgrapes.oauth
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - net.cotellese.mindgrapes

  # The wrist. A companion of MindGrapes, not an independent watch app: it holds
  # no tokens, no queue, and no networking, and hands each capture to the phone
  # over WCSession (SPEC Decision 5, 4.2, 10.8). The bundle id sits inside the
  # phone app's namespace because that is what makes the pair counterparts.
  MindGrapesWatch:
    type: application
    platform: watchOS
    # watchOS 27 to match the phone's iOS 27 floor. Nothing here needs 27 on its
    # own; keeping the pair on one generation avoids a second availability story.
    deploymentTarget: "27.0"
    sources:
      - path: MindGrapesWatch
    dependencies:
      - package: MindGrapesKit
        product: MindGrapesKit
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.cotellese.mindgrapes.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        # No CODE_SIGN_ENTITLEMENTS: the wrist holds no tokens (so no Keychain
        # access group) and no queue (so no App Group). SPEC 4.2.
    info:
      path: MindGrapesWatch/Info.plist
      properties:
        CFBundleDisplayName: MindGrapes
        # Single-target watch app (watchOS 7+ packaging), and the counterpart
        # pointer. Without WKCompanionAppBundleIdentifier the system does not
        # treat the two apps as a pair and WCSession never connects.
        WKApplication: true
        WKCompanionAppBundleIdentifier: net.cotellese.mindgrapes
        # SPEC 9: the fix is taken on the wrist, because a capture made on a run
        # should record where the runner was, not where the phone caught up.
        NSLocationWhenInUseUsageDescription: MindGrapes tags a capture with where you made it, when you turn location on.

schemes:
  MindGrapes:
    build:
      targets:
        MindGrapes: all
    run:
      config: Debug
    test:
      config: Debug

  MindGrapesWatch:
    build:
      targets:
        MindGrapesWatch: all
    run:
      config: Debug
